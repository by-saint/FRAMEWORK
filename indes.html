V.reorganizar=()=>{const r=R.res;return`<h2>Reorganizar minha semana</h2><div class="c"><p class="mu">Informe o período que ficou indisponível. O FLUXO mostra o impacto e só aplica após sua confirmação.</p><div class="row"><input type="date" id="rd" value="${R.date}"><input type="time" id="rs" value="${R.s}"><input type="time" id="re" value="${R.e}"><input id="rn" placeholder="Motivo" value="${E(R.n)}"><button class="b" data-a="ran">Analisar</button></div></div>`+(r?`<div class="c"><h3>Conflito e impacto</h3>${r.fx.map(b=>`<p class="er">Atinge compromisso fixo: ${b.l} (${hm(b.s)}–${hm(b.e)}). Ele não será alterado automaticamente.</p>`).join('')}${r.aff.length?'':'<p>Nenhuma tarefa agendada é afetada.</p>'}${r.mv.map(x=>`<div class="it" style="--k:${KC.task}"><span>${E(x.t.name)}</span><span class="mu">→ ${fd(x.d)} ${hm(x.s)}</span></div>`).join('')}${r.un.map(t=>`<div class="it" style="--k:var(--wa)"><span>${E(t.name)}</span><span class="mu">sem horário livre: será marcada como Adiada, sem data</span></div>`).join('')}${r.rigid.map(t=>`<div class="it" style="--k:var(--er)"><span>${E(t.name)}</span><span class="mu">não pode ser adiada: conflito mantido — decida manualmente</span></div>`).join('')}<p>Meta ${fh(r.g)}: produzido + agendado antes ${fh(r.before)} (${r.g?Math.round(r.before/r.g*100):0}%) → depois ${fh(r.after)} (${r.g?Math.round(r.after/r.g*100):0}%).</p><button class="b" data-a="rco">Confirmar e aplicar</button></div>`:'')};
/* DESEMPENHO */
V.desempenho=()=>{const t0=today(),mo=mon(t0),g=wkGoal(mo),ws=new Set(Object.keys(D.weeks));D.sessions.forEach(s=>ws.add(mon(s.d)));const W=[...ws].sort().reverse(),pm={};D.sessions.forEach(s=>pm[s.proj]=(pm[s.proj]||0)+s.min);const tot=Object.values(pm).reduce((a,b)=>a+b,0),
 M=[...Array(6)].map((_,i)=>{const d=new Date(Date.UTC(+t0.slice(0,4),+t0.slice(5,7)-1-(5-i),1)).toISOString().slice(0,7);return{l:d.slice(5)+'/'+d.slice(2,4),v:sumMin(s=>s.d.startsWith(d))}}),cnt=s=>D.tasks.filter(t=>t.status===s).length;
 return`<h2>Meu desempenho</h2><div class="row"><button data-a="cfg">Editar meta semanal</button></div><div class="g"><div class="c"><h3>Produção diária (14 dias)</h3>${bars([...Array(14)].map((_,i)=>{const d=addD(t0,i-13);return{l:d.slice(8),v:sumMin(s=>s.d===d)}}))}</div>
 <div class="c"><h3>Semanal vs meta (8 semanas)</h3>${bars([...Array(8)].map((_,i)=>{const w=addD(mo,-7*(7-i));return{l:w.slice(8)+'/'+w.slice(5,7),v:wkMin(w)}}),g)}</div>
 <div class="c"><h3>Mensal</h3>${bars(M)}</div><div class="c"><h3>Tempo por projeto</h3>${Object.entries(pm).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<div>${E(pName(id))} · ${fh(v)} (${Math.round(v/tot*100)}%)</div>${prog(v,tot)}`).join('')||'<p class="mu">Sem sessões registradas.</p>'}</div></div>
 <div class="c"><h3>Tarefas</h3>Concluídas: ${cnt('Concluída')} · Adiadas: ${cnt('Adiada')} · Canceladas: ${cnt('Cancelada')}</div>
 <div class="c ov"><h3>Relatório por semana</h3><table><tr><th>Semana</th><th>Meta</th><th>Produzido</th><th>%</th><th>Tarefas</th><th>Projetos</th><th>Resultado</th></tr>${W.map(w=>{const p=wkMin(w),gg=wkGoal(w),pr=[...new Set(D.sessions.filter(s=>mon(s.d)===w).map(s=>pName(s.proj)))].join(', ');return`<tr><td>${fd(w)} – ${fd(addD(w,6))}</td><td>${fh(gg)}</td><td>${fh(p)}</td><td>${gg?Math.round(p/gg*100):0}%</td><td>${wkDone(w)}</td><td>${E(pr)||'—'}</td><td>${w===mo?'Em andamento':p>=gg?'Meta atingida':'Meta não atingida'}</td></tr>`}).join('')}</table></div>`};
/* HISTÓRICO */
V.historico=()=>{const S=D.sessions.slice().sort((a,b)=>b.s-a.s),T=D.tasks.filter(t=>t.status==='Concluída'||t.status==='Cancelada').sort((a,b)=>(b.done||'')<(a.done||'')?-1:1);
 return`<h2>Histórico</h2><div class="c"><h3>Sessões (${S.length})</h3>${S.map(s=>`<div class="it" style="--k:${KC.sess}"><span>${fd(s.d)} ${tOf(s.s)}–${tOf(s.e)} · ${E(s.task&&tk(s.task)?tk(s.task).name:'—')} · ${E(pName(s.proj))}</span><span class="mu">${fh(s.min)}</span></div>`).join('')||'<p class="mu">Vazio.</p>'}</div><div class="c"><h3>Tarefas concluídas e canceladas</h3>${T.map(t=>`<div class="it" style="--k:${KC.task}"><span>${E(t.name)}</span><span class="mu">${t.status}${t.done?' em '+fd(t.done):''}</span></div>`).join('')||'<p class="mu">Vazio.</p>'}</div>
 <div class="c"><h3>Backup</h3><p class="mu">Os dados são sincronizados com sua conta na nuvem quando conectado. Gere um backup periódico para ter uma cópia independente.</p><textarea id="bk" rows="4" style="width:100%"></textarea><div class="row"><button data-a="bkg">Gerar backup</button><button data-a="bkd">Baixar arquivo</button><button data-a="bkr">Restaurar do texto</button></div></div>`};
A.bkg=()=>{$('#bk').value=JSON.stringify(D)};A.bkr=()=>{try{const o=JSON.parse($('#bk').value);if(!o.tasks||!o.sessions)throw 0;ask('Substituir todos os dados atuais?',()=>{D=Object.assign(blank(),o)})}catch(e){toast('Backup inválido.')}};
/* SUPABASE CLOUD SYNC */
// Preencha com os dados do seu projeto Supabase (Project URL e anon/public key).
const SUPABASE_URL='COLE_AQUI_SUA_PROJECT_URL';
const SUPABASE_PUBLISHABLE_KEY='COLE_AQUI_SUA_ANON_PUBLIC_KEY';
let DB=null,UID=null,SY='local',tmr=null,busy=false,dirty=false,cloudReady=false;
const SYT={local:'Configure o Supabase',sync:'Sincronizando…',ok:'☁ Salvo na nuvem',err:'⚠ Falha na sincronização'};
function setSy(x){SY=x;const e=$('#sy');if(e)e.textContent=SYT[x]||x}
function hasLocalData(){return !!(D.tasks.length||D.projects.length||D.sessions.length||Object.keys(D.days).length||Object.keys(D.weeks).length)}
function sched(){if(!DB||!UID||!cloudReady)return;dirty=true;setSy('sync');clearTimeout(tmr);tmr=setTimeout(push,700)}
async function push(){if(!DB||!UID||!cloudReady)return;if(busy){tmr=setTimeout(push,400);return}busy=true;dirty=false;try{
 const payload={user_id:UID,data:D,updated_at:new Date().toISOString()};
 const {error}=await DB.from('fluxo_data').upsert(payload,{onConflict:'user_id'});
 if(error)throw error;setSy(dirty?'sync':'ok');
 }catch(e){console.error('FLUXO sync error:',e);setSy('err');toast('Não foi possível sincronizar. Seus dados locais foram preservados.');}
 busy=false;if(dirty)sched()}
async function pullCloud(){
 const {data,error}=await DB.from('fluxo_data').select('data,updated_at').eq('user_id',UID).maybeSingle();
 if(error)throw error;
 if(data&&data.data){
   // A nuvem é a fonte principal quando já existe um registro para esta conta.
   D=Object.assign(blank(),data.data||{});
   try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){console.warn('Local cache unavailable',e)}
   setSy('ok');
 }else{
   // Migra dados locais antigos apenas na primeira conta deste navegador.
   // Evita copiar dados de uma conta para outra ao alternar usuários.
   const localOwner=localStorage.getItem(KEY+'.owner');
   if(hasLocalData()&&(!localOwner||localOwner===UID))D.t=D.t||Date.now();
   else {D=blank();D.t=Date.now();}
   cloudReady=true;
   await push();
 }
 try{localStorage.setItem(KEY+'.owner',UID)}catch(e){}
 cloudReady=true;render();
}
function showAuth(message=''){$('#authscreen').style.display='flex';$('nav').style.display='none';$('main').style.display='none';$('#authmsg').textContent=message}
function showApp(){$('#authscreen').style.display='none';$('nav').style.display='';$('main').style.display='';render()}
async function authAction(kind){
 const email=$('#authemail').value.trim(),password=$('#authpass').value;
 if(kind!=='reset'&&(!email||!password)){showAuth('Informe e-mail e senha.');return}
 $('#authmsg').textContent='Aguarde…';
 try{
  let result;
  if(kind==='signup')result=await DB.auth.signUp({email,password});
  else if(kind==='reset')result=await DB.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  else result=await DB.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;
  if(kind==='signup'&&!result.data.session){showAuth('Cadastro iniciado. Confirme seu e-mail pelo link enviado e depois entre.');return}
  if(kind==='reset'){showAuth('Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.');return}
  $('#authmsg').textContent='Login realizado. Carregando sua agenda…';
 }catch(e){console.error(e);showAuth(e.message||'Erro de autenticação. Verifique os dados e tente novamente.')}
}
$('#authform').addEventListener('submit',e=>{e.preventDefault();authAction('login')});
$('#signupbtn').addEventListener('click',()=>authAction('signup'));
$('#resetbtn').addEventListener('click',()=>authAction('reset'));
A.logout=async()=>{if(!DB)return;const {error}=await DB.auth.signOut();if(error){toast('Não foi possível sair da conta.');return}UID=null;cloudReady=false;showAuth('Você saiu da sua conta.')};
A.bkd=()=>{try{const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fluxo-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url)}catch(e){toast('Não foi possível baixar o backup.')}};
document.addEventListener('visibilitychange',()=>{if(DB&&UID&&cloudReady&&!document.hidden&&!busy&&dirty)push()});
view=NAV.some(n=>'#'+n[0]===location.hash)?location.hash.slice(1):'visao';
(async()=>{
 const ld=$('#ld');ld.style.display='flex';
 try{
  if(!window.supabase||!SUPABASE_URL.startsWith('https://')||SUPABASE_PUBLISHABLE_KEY.startsWith('COLE_')){
   ld.style.display='none';showAuth('Antes de usar, configure SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY no arquivo index.html.');return;
  }
  DB=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data:{session},error}=await DB.auth.getSession();if(error)throw error;
  if(!session){ld.style.display='none';showAuth();return}
  UID=session.user.id;await pullCloud();
  DB.auth.onAuthStateChange(async(event,sessionNow)=>{
   if(event==='SIGNED_OUT'){UID=null;cloudReady=false;showAuth('Você saiu da sua conta.');return}
   if(event==='SIGNED_IN'&&sessionNow&&(!cloudReady||UID!==sessionNow.user.id)){
    UID=sessionNow.user.id;cloudReady=false;try{await pullCloud()}catch(e){console.error(e);showAuth('Erro ao carregar os dados da nuvem: '+(e.message||''))}
   }
  });
 }catch(e){console.error('FLUXO initialization error:',e);showAuth('Erro ao conectar ao Supabase: '+(e.message||'Confira a URL, a chave e a tabela.'))}
 finally{ld.style.display='none'}
})();
</script></body></html>
